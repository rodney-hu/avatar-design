<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemental Design System — Showcase</title>
  <meta name="description" content="A premium dark-first design system inspired by Avatar: The Last Airbender, built with Tailwind CSS v4.">
  <link rel="stylesheet" href="./dist/output.css">
  <!-- motion.js runs before first paint so .motion-ready arms reveals without a flash -->
  <script src="./motion.js"></script>
</head>
<body class="antialiased">

  <!-- NAVBAR: glass, top highlight at rest, elevation-2 once scrolled -->
  <header class="navbar glass-thick navbar-edge" id="navbar">
    <a href="#" class="nav-brand" data-tab-link="colors"><span class="tracking-brand">ELEMENTAL <span class="text-fire-500 font-extrabold">UI</span></span></a>
    <nav class="flex items-center gap-6">
      <a href="#colors" class="nav-link nav-link-active" data-tab-link="colors">Colors</a>
      <a href="#components" class="nav-link" data-tab-link="components">Components</a>
      <a href="#data" class="nav-link" data-tab-link="data">Data</a>
      <a href="#landing" class="nav-link" data-tab-link="landing">Landing Blocks</a>
    </nav>
    <div class="flex items-center gap-3">
      <button id="theme-toggle" class="btn btn-outline btn-sm">Light Mode</button>
      <button class="btn btn-fire btn-sm" data-tab-link="landing">Get Presets</button>
    </div>
  </header>

  <!-- ================= SCREEN 1: COLORS (hero, palette, typography) ================= -->
  <template id="page-colors">
    <div data-page="colors">
      <section class="hero animate-fade-in-up" id="main-hero" style="border-bottom:1px solid var(--color-border-subtle)">
        <!-- Halo on its own parallax layer; offset by absolute px so the radial fade stays inside the hero -->
        <div class="hero-fire" id="hero-halo" data-parallax="0.35" aria-hidden="true" style="position:absolute;top:-40px;bottom:-40px;left:0;right:0;pointer-events:none;z-index:0"></div>
        <div data-parallax="0.08" style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:inherit;width:100%">
          <div class="flex flex-wrap justify-center gap-2">
            <span class="badge badge-fire">Fire Primary</span>
            <span class="badge badge-water">Water</span>
            <span class="badge badge-earth">Earth</span>
            <span class="badge badge-air">Air</span>
            <span class="badge badge-avatar">Avatar State</span>
          </div>
          <h1 class="hero-title text-glow-fire m-0" id="hero-title">Harness the Elements<br>in Your UI</h1>
          <p class="hero-subtitle m-0">A complete dark-theme design system. Token-driven surfaces, elemental glows, and pre-built components for SaaS, landing pages, and web applications.</p>
          <div class="flex flex-wrap items-center justify-center gap-3 p-2 bg-surface-raised border border-border-subtle rounded-xl">
            <span class="stat-label px-2" style="font-size:0.75rem">Theme preview</span>
            <button class="btn btn-fire btn-sm" data-element="fire">Fire Nation</button>
            <button class="btn btn-ghost btn-sm" data-element="water">Water Tribe</button>
            <button class="btn btn-ghost btn-sm" data-element="earth">Earth Kingdom</button>
            <button class="btn btn-ghost btn-sm" data-element="air">Air Nomads</button>
          </div>
          <div class="flex flex-wrap justify-center gap-4">
            <button class="btn btn-fire btn-lg motion-gradient-drift-slow" id="trigger-toast-btn">Unleash Toast</button>
            <button class="btn btn-outline btn-lg" data-open-modal>Open Bending Modal</button>
          </div>
        </div>
      </section>

      <main class="shell-main">
        <!-- 01. COLOR PALETTE -->
        <section class="flex flex-col gap-8" id="colors" data-halo-bloom>
          <div class="sec-head" data-reveal>
            <span class="badge badge-fire w-fit">01. Color Palette</span>
            <h2>The Four Nations Palette</h2>
            <p>Deep dark surface system paired with vibrant elemental accents.</p>
          </div>
          <!-- Specimens use literal hexes so the Brand tweak can't make them state the wrong values. -->
          <div class="flex flex-col gap-3" data-reveal>
            <h3 class="m-0 font-display text-[1.25rem] font-semibold">Fire Nation (Primary Palette)</h3>
            <div class="ramp10">
              <div><div class="swatch" style="background:#fff2f2;color:#000;border:1px solid var(--color-border-subtle)"></div><div class="ckey">50</div></div>
              <div><div class="swatch" style="background:#ffd6d6;color:#000"></div><div class="ckey">100</div></div>
              <div><div class="swatch" style="background:#ffa3a3;color:#000">200</div><div class="ckey">200</div></div>
              <div><div class="swatch" style="background:#f76d6d;color:#000">300</div><div class="ckey">300</div></div>
              <div><div class="swatch" style="background:#dd3333;color:#fff">400</div><div class="ckey">400</div></div>
              <div><div class="swatch" style="background:#aa0000;color:#fff">500</div><div class="ckey">500 (CTA)</div></div>
              <div><div class="swatch" style="background:#8f0000;color:#fff">600</div><div class="ckey">600</div></div>
              <div><div class="swatch" style="background:#6e0000;color:#fff">700</div><div class="ckey">700</div></div>
              <div><div class="swatch" style="background:#4d0000;color:#fff">800</div><div class="ckey">800</div></div>
              <div><div class="swatch" style="background:#2e0000;color:#fff">900</div><div class="ckey">900</div></div>
            </div>
          </div>
          <div class="flex flex-col gap-3" data-reveal>
            <h3 class="m-0 font-display text-[1.25rem] font-semibold">Water Tribe (Secondary Palette)</h3>
            <div class="ramp10">
              <div><div class="swatch" style="background:#f0f9ff;color:#000;border:1px solid var(--color-border-subtle)"></div><div class="ckey">50</div></div>
              <div><div class="swatch" style="background:#cce8ff;color:#000"></div><div class="ckey">100</div></div>
              <div><div class="swatch" style="background:#8ecfff;color:#000">200</div><div class="ckey">200</div></div>
              <div><div class="swatch" style="background:#4db8ff;color:#000">300</div><div class="ckey">300</div></div>
              <div><div class="swatch" style="background:#1aa3ff;color:#fff">400</div><div class="ckey">400</div></div>
              <div><div class="swatch" style="background:#0088e0;color:#fff">500</div><div class="ckey">500</div></div>
              <div><div class="swatch" style="background:#006db3;color:#fff">600</div><div class="ckey">600</div></div>
              <div><div class="swatch" style="background:#005289;color:#fff">700</div><div class="ckey">700</div></div>
              <div><div class="swatch" style="background:#003a63;color:#fff">800</div><div class="ckey">800</div></div>
              <div><div class="swatch" style="background:#00243d;color:#fff">900</div><div class="ckey">900</div></div>
            </div>
          </div>
          <div class="grid2" data-reveal>
            <div class="flex flex-col gap-3" data-reveal>
              <h3 class="m-0 font-display text-[1.25rem] font-semibold">Earth Kingdom</h3>
              <div class="ramp10">
                <div><div class="swatch" style="background:#f0fff4;color:#000;border:1px solid var(--color-border-subtle)"></div><div class="ckey">50</div></div>
                <div><div class="swatch" style="background:#c6f6d5;color:#000"></div><div class="ckey">100</div></div>
                <div><div class="swatch" style="background:#88e8a0;color:#000">200</div><div class="ckey">200</div></div>
                <div><div class="swatch" style="background:#4cd964;color:#000">300</div><div class="ckey">300</div></div>
                <div><div class="swatch" style="background:#2ecc40;color:#000">400</div><div class="ckey">400</div></div>
                <div><div class="swatch" style="background:#27ae34;color:#fff">500</div><div class="ckey">500</div></div>
                <div><div class="swatch" style="background:#1f8c2a;color:#fff">600</div><div class="ckey">600</div></div>
                <div><div class="swatch" style="background:#186b20;color:#fff">700</div><div class="ckey">700</div></div>
                <div><div class="swatch" style="background:#114e18;color:#fff">800</div><div class="ckey">800</div></div>
                <div><div class="swatch" style="background:#0a3010;color:#fff">900</div><div class="ckey">900</div></div>
              </div>
            </div>
            <div class="flex flex-col gap-3" data-reveal>
              <h3 class="m-0 font-display text-[1.25rem] font-semibold">Air Nomads</h3>
              <div class="ramp10">
                <div><div class="swatch" style="background:#fffef5;color:#000;border:1px solid var(--color-border-subtle)"></div><div class="ckey">50</div></div>
                <div><div class="swatch" style="background:#fff8cc;color:#000"></div><div class="ckey">100</div></div>
                <div><div class="swatch" style="background:#ffed8a;color:#000">200</div><div class="ckey">200</div></div>
                <div><div class="swatch" style="background:#ffe048;color:#000">300</div><div class="ckey">300</div></div>
                <div><div class="swatch" style="background:#ffd700;color:#000">400</div><div class="ckey">400</div></div>
                <div><div class="swatch" style="background:#e6bf00;color:#000">500</div><div class="ckey">500</div></div>
                <div><div class="swatch" style="background:#b89700;color:#fff">600</div><div class="ckey">600</div></div>
                <div><div class="swatch" style="background:#8a7100;color:#fff">700</div><div class="ckey">700</div></div>
                <div><div class="swatch" style="background:#5c4b00;color:#fff">800</div><div class="ckey">800</div></div>
                <div><div class="swatch" style="background:#3a3000;color:#fff">900</div><div class="ckey">900</div></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 02. TYPOGRAPHY -->
        <section class="flex flex-col gap-6" id="typography" data-halo-bloom="air">
          <div class="sec-head" data-reveal>
            <span class="badge badge-air w-fit">02. Typography</span>
            <h2>Type Hierarchy</h2>
            <p>Inter for every headline, a brush face for standalone element headings and all interface copy, JetBrains Mono for code.</p>
          </div>
          <div class="card elevation-1 flex flex-col gap-6" data-stagger>
            <div class="border-b border-border-subtle pb-4">
              <p class="ckey text-left m-0 mb-1">Display / Inter 800 / 80px</p>
              <h1 class="m-0 font-hero font-extrabold text-hero leading-tight tracking-display text-fire-500">The Fire Nation</h1>
            </div>
            <div class="border-b border-border-subtle pb-4">
              <p class="ckey text-left m-0 mb-1">Heading LG / Inter 800 / 32px</p>
              <h2 class="m-0 font-display font-extrabold text-[2rem] tracking-display">Master All Four Elements</h2>
            </div>
            <div class="border-b border-border-subtle pb-4">
              <p class="ckey text-left m-0 mb-1">Body LG / Inter / 18px</p>
              <p class="m-0 text-[1.125rem] text-text-secondary leading-relaxed">Water is the element of change. Earth is the element of substance. Fire is the element of power. Air is the element of freedom.</p>
            </div>
            <div>
              <p class="ckey text-left m-0 mb-1">Code / JetBrains Mono / 14px</p>
              <code class="code-block block w-fit">const bendingMaster = new ElementalBender('Avatar Aang');</code>
            </div>
          </div>
        </section>
      </main>
    </div>
  </template>

  <!-- ================= SCREEN 2: COMPONENTS ================= -->
  <template id="page-components">
    <div data-page="components">
      <main class="shell-main">
        <!-- 03. BUTTONS -->
        <section class="flex flex-col gap-6" id="buttons" data-halo-bloom>
          <div class="sec-head" data-reveal>
            <span class="badge badge-water w-fit">03. Buttons &amp; Actions</span>
            <h2>Bending Action Buttons</h2>
            <p>Elemental hover glows, tactile active states, and custom variants.</p>
          </div>
          <div class="card elevation-1 flex flex-col gap-8" data-reveal>
            <div>
              <h4 class="stat-label m-0 mb-3">Elemental variants</h4>
              <div class="flex flex-wrap gap-4">
                <button class="btn btn-fire">Fire</button>
                <button class="btn btn-water">Water</button>
                <button class="btn btn-earth">Earth</button>
                <button class="btn btn-air">Air</button>
                <button class="btn btn-avatar">Avatar</button>
              </div>
            </div>
            <div>
              <h4 class="stat-label m-0 mb-3">Styles &amp; sizes</h4>
              <div class="flex flex-wrap items-center gap-4">
                <button class="btn btn-fire btn-lg">Large Fire</button>
                <button class="btn btn-fire">Medium Fire</button>
                <button class="btn btn-fire btn-sm">Small Fire</button>
                <button class="btn btn-outline">Outline</button>
                <button class="btn btn-ghost">Ghost Link</button>
                <button class="btn btn-fire" disabled>Disabled</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 04. CARDS -->
        <section class="flex flex-col gap-6" id="cards" data-halo-bloom="earth">
          <div class="sec-head" data-reveal>
            <span class="badge badge-earth w-fit">04. Cards &amp; Containers</span>
            <h2>Layered Surfaces &amp; Glass</h2>
            <p>Depth layers from #0a0a0a to elevated cards with glowing borders.</p>
          </div>
          <div class="grid3" data-stagger>
            <div class="card card-fire elevation-2 flex flex-col gap-3" data-tilt>
              <div class="flex items-center justify-between"><span class="badge badge-fire">Fire Nation</span></div>
              <h3 class="m-0 font-display text-[1.25rem] font-bold">Sun Warrior Temple</h3>
              <p class="m-0 text-[0.875rem] text-text-secondary">The original source of firebending power, guarded by the dragons Ran and Shaw.</p>
              <button class="btn btn-fire btn-sm w-full">Enter Temple</button>
            </div>
            <div class="card card-water elevation-2 flex flex-col gap-3" data-tilt>
              <div class="flex items-center justify-between"><span class="badge badge-water">Northern Tribe</span></div>
              <h3 class="m-0 font-display text-[1.25rem] font-bold">Spirit Oasis</h3>
              <p class="m-0 text-[0.875rem] text-text-secondary">A sacred haven at the North Pole where Tui and La circle in eternal harmony.</p>
              <button class="btn btn-water btn-sm w-full">Visit Sanctuary</button>
            </div>
            <div class="card card-glass glass border-gradient elevation-2 flex flex-col gap-3" data-tilt>
              <div class="flex items-center justify-between"><span class="badge badge-avatar">Glassmorphism</span></div>
              <h3 class="m-0 font-display text-[1.25rem] font-bold">Cosmic Energy Overlay</h3>
              <p class="m-0 text-[0.875rem] text-text-secondary">Backdrop blur at 16px with glowing highlights.</p>
              <button class="btn btn-avatar btn-sm w-full" data-open-modal>Unlock Energy</button>
            </div>
          </div>
        </section>

        <!-- 05. FORMS -->
        <section class="flex flex-col gap-6" id="forms" data-halo-bloom>
          <div class="sec-head" data-reveal>
            <span class="badge badge-fire w-fit">05. Forms &amp; Inputs</span>
            <h2>Form Controls</h2>
            <p>Inputs with elemental focus halos, custom toggles, and select menus.</p>
          </div>
          <div class="card elevation-1 grid2" data-reveal>
            <div class="flex flex-col gap-4">
              <div class="field">
                <label for="avatar-name" class="stat-label field-label" style="font-size:0.75rem">Avatar Name</label>
                <span class="field-control"><input id="avatar-name" class="input" value="Aang" placeholder="e.g. Aang, Korra, Roku"><span class="field-line" aria-hidden="true"></span></span>
              </div>
              <div class="flex flex-col gap-1">
                <label for="primary-element" class="stat-label" style="font-size:0.75rem">Primary Element</label>
                <select id="primary-element" class="select">
                  <option>Firebending</option>
                  <option>Waterbending</option>
                  <option>Earthbending</option>
                  <option>Airbending</option>
                </select>
              </div>
            </div>
            <div class="flex flex-col gap-4">
              <div class="flex flex-col gap-1">
                <label for="scroll-notes" class="stat-label" style="font-size:0.75rem">Scroll Notes</label>
                <textarea id="scroll-notes" rows="3" class="textarea" placeholder="Write ancient bending techniques..."></textarea>
              </div>
              <div class="flex items-center justify-between pt-2">
                <label for="avatar-state" class="inline-flex items-center gap-2 cursor-pointer text-[0.9375rem]">
                  <span class="check"><input id="avatar-state" type="checkbox" class="checkbox" checked><svg class="check-mark" viewBox="0 0 16 16" aria-hidden="true"><path pathLength="1" d="M3.5 8.5l3 3 6-7"></path></svg></span>
                  <span>Enable Avatar State</span>
                </label>
                <span class="inline-flex items-center gap-2">
                  <span class="text-text-muted" style="font-size:0.75rem">Ember Glow</span>
                  <label class="toggle-switch"><input id="ember-glow" type="checkbox" checked><span class="toggle-slider"></span></label>
                </span>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </template>

  <!-- ================= SCREEN 3: DATA ================= -->
  <template id="page-data">
    <div data-page="data">
      <main class="shell-main">
        <!-- 06. DATA & DASHBOARDS -->
        <section class="flex flex-col gap-6" id="data" data-halo-bloom="water">
          <div class="sec-head" data-reveal>
            <span class="badge badge-water w-fit">06. Data &amp; Dashboards</span>
            <h2>Stats &amp; Tables</h2>
            <p>Data components for SaaS dashboards and analytics screens.</p>
          </div>
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a class="breadcrumb-item" href="#">Nations</a><span aria-hidden="true">/</span>
            <a class="breadcrumb-item" href="#">Fire Nation</a><span aria-hidden="true">/</span>
            <span class="text-text-primary">Caldera</span>
          </nav>
          <!-- data-count-up: count up on first view; Fire Power Index also flashes on live change -->
          <div class="grid4" data-stagger>
            <div class="stat-card" style="border-color:rgb(var(--fire-500-rgb) / 0.3)" data-count-up id="stat-power">
              <span class="stat-label">Fire Power Index</span>
              <span class="stat-value text-glow-fire" style="color:var(--color-fire-500)">98.4%</span>
              <span class="stat-delta block text-xs" style="color:var(--color-fire-500)">↑ +14.2% Comet boost</span>
            </div>
            <div class="stat-card" style="border-color:rgb(var(--water-500-rgb) / 0.3)" data-count-up>
              <span class="stat-label">Oceanic Flow Rate</span>
              <span class="stat-value text-glow-water" style="color:var(--color-water-500)">1,420 L/s</span>
              <span class="stat-delta block text-xs" style="color:var(--color-water-500)">Full Moon Alignment</span>
            </div>
            <div class="stat-card" style="border-color:rgb(var(--earth-500-rgb) / 0.3)" data-count-up>
              <span class="stat-label">Seismic Density</span>
              <span class="stat-value text-glow-earth" style="color:var(--color-earth-500)">840 MPa</span>
              <span class="stat-delta block text-xs" style="color:var(--color-earth-500)">Ground vibration stable</span>
            </div>
            <div class="stat-card" style="border-color:rgb(var(--air-500-rgb) / 0.3)" data-count-up>
              <span class="stat-label">Air Velocity</span>
              <span class="stat-value text-glow-air" style="color:var(--color-air-500)">120 km/h</span>
              <span class="stat-delta block text-xs" style="color:var(--color-air-500)">Glider lift optimal</span>
            </div>
          </div>
          <div class="flex gap-6 items-start data-split" data-reveal>
            <aside class="sidebar" style="height:auto;border-radius:var(--radius-lg);border:1px solid var(--color-border-subtle)">
              <div class="flex flex-col gap-2 flex-1">
                <a class="sidebar-item sidebar-item-active"><span>Fire Nation</span></a>
                <a class="sidebar-item"><span>Water Tribe</span></a>
                <a class="sidebar-item"><span>Earth Kingdom</span></a>
                <a class="sidebar-item"><span>Air Nomads</span></a>
              </div>
            </aside>
            <div class="flex-1">
              <table class="table-elemental">
                <thead><tr><th>Master</th><th>Affiliation</th><th>Specialty</th><th>Status</th></tr></thead>
                <tbody>
                  <tr><td><span class="font-semibold text-fire-400">Zuko</span></td><td>Fire Nation</td><td>Lightning Redirection</td><td><span class="badge badge-fire">Active Fire Lord</span></td></tr>
                  <tr><td><span class="font-semibold text-water-400">Katara</span></td><td>Southern Water Tribe</td><td>Bloodbending / Healing</td><td><span class="badge badge-water">Grandmaster</span></td></tr>
                  <tr><td><span class="font-semibold text-earth-400">Toph Beifong</span></td><td>Earth Kingdom</td><td>Metalbending Creator</td><td><span class="badge badge-earth">Chief of Police</span></td></tr>
                  <tr><td><span class="font-semibold text-air-400">Aang</span></td><td>Air Nomads</td><td>Energybending</td><td><span class="badge badge-avatar">Avatar State</span></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- 07. FEEDBACK & ALERTS -->
        <section class="flex flex-col gap-6" id="feedback" data-halo-bloom>
          <div class="sec-head" data-reveal>
            <span class="badge badge-fire w-fit">07. Feedback &amp; Alerts</span>
            <h2>Elemental Notifications</h2>
            <p>Status callouts themed after each element.</p>
          </div>
          <div class="flex flex-col gap-4" data-stagger>
            <div class="alert alert-fire"><div><p class="m-0"><b>Fire Warning:</b> High thermal activity detected in the Caldera.</p></div></div>
            <div class="alert alert-water"><div><p class="m-0"><b>Water Info:</b> Tidal waves arriving at high tide tonight.</p></div></div>
            <div class="alert alert-earth"><div><p class="m-0"><b>Earth Success:</b> Defense walls fortified at Ba Sing Se.</p></div></div>
            <div class="alert alert-air"><div><p class="m-0"><b>Air Notice:</b> Tailwinds favorable for Northern Air Temple flight.</p></div></div>
          </div>
        </section>
      </main>
    </div>
  </template>

  <!-- ================= SCREEN 4: LANDING BLOCKS ================= -->
  <template id="page-landing">
    <div data-page="landing">
      <main class="shell-main">
        <!-- 08. PRICING & TESTIMONIALS -->
        <section class="flex flex-col gap-6" id="landing" data-halo-bloom="avatar">
          <div class="sec-head" data-reveal>
            <span class="badge badge-avatar w-fit">08. SaaS &amp; Landing Blocks</span>
            <h2>Pricing &amp; Testimonials</h2>
            <p>Pre-built landing page layouts designed for conversion.</p>
          </div>
          <!-- Spotlight group: the cursor light spans every card; the featured tier carries the one edge light. -->
          <div class="grid3 items-center" style="gap:2rem" data-stagger data-spotlight-group>
            <div class="pricing-card elevation-1 elevation-lift element-fire" data-spotlight>
              <span class="badge badge-air w-fit">Initiate</span>
              <h3 class="m-0 font-display text-[1.5rem] font-bold">Air Nomad</h3>
              <div class="pricing-price">$19 <span class="text-[0.875rem] font-normal text-text-muted">/mo</span></div>
              <p class="m-0 text-[0.875rem] text-text-secondary">Essential bending tokens and basic components.</p>
              <button class="btn btn-outline w-full">Start Free Trial</button>
            </div>
            <div class="pricing-card pricing-featured edge-light elevation-3 element-fire">
              <div class="absolute" style="top:-0.75rem;right:1.5rem"><span class="badge badge-fire">Most Popular</span></div>
              <span class="badge badge-fire w-fit">Fire Master</span>
              <h3 class="m-0 font-display text-[1.5rem] font-bold">Fire Nation Pro</h3>
              <div class="pricing-price text-glow-fire" style="color:var(--color-fire-500)">$49 <span class="text-[0.875rem] font-normal text-text-muted">/mo</span></div>
              <p class="m-0 text-[0.875rem] text-text-secondary">Full elemental component suite, glowing effects and the Tailwind v4 preset.</p>
              <button class="btn btn-fire w-full">Unlock Full Power</button>
            </div>
            <div class="pricing-card elevation-1 elevation-lift element-fire" data-spotlight>
              <span class="badge badge-avatar w-fit">Avatar</span>
              <h3 class="m-0 font-display text-[1.5rem] font-bold">Avatar Enterprise</h3>
              <div class="pricing-price">$149 <span class="text-[0.875rem] font-normal text-text-muted">/mo</span></div>
              <p class="m-0 text-[0.875rem] text-text-secondary">Custom element styling, dedicated support and source SVGs.</p>
              <button class="btn btn-outline w-full">Contact White Lotus</button>
            </div>
          </div>
          <figure class="testimonial-card m-0" data-reveal>
            <blockquote class="testimonial-quote m-0">Water is the element of change. Earth is the element of substance. Fire is the element of power. Air is the element of freedom.</blockquote>
            <figcaption class="testimonial-author">
              <div>
                <div class="font-semibold text-[0.9375rem]">Iroh</div>
                <div class="text-[0.8125rem] text-text-muted">Order of the White Lotus</div>
              </div>
            </figcaption>
          </figure>
        </section>

        <!-- 09. INSTALLATION -->
        <section class="flex flex-col gap-6 border-t border-border-subtle pt-16" id="integration" data-halo-bloom>
          <div class="sec-head" data-reveal>
            <span class="badge badge-fire w-fit">09. Installation Guide</span>
            <h2>How to Use in Any Tailwind v4 Project</h2>
            <p>One CSS file unlocks the entire elemental system.</p>
          </div>
          <div class="card elevation-1 flex flex-col gap-4" data-reveal>
            <p class="m-0 text-[0.875rem] text-text-secondary">Add this import to your project's main stylesheet:</p>
            <div class="code-block">
              <button class="btn btn-ghost btn-sm copy-btn" data-code-target="import-code" data-burst="off">Copy</button>
              <pre class="m-0" id="import-code"><code>@import "tailwindcss";
@import "./path/to/elemental-ds/src/index.css";</code></pre>
            </div>
            <p class="m-0 text-[0.875rem] text-text-secondary">For reveal, tilt, spotlight, edge light, click bursts and page transitions, also load the motion runtime:</p>
            <div class="code-block">
              <button class="btn btn-ghost btn-sm copy-btn" data-code-target="motion-code" data-burst="off">Copy</button>
              <pre class="m-0" id="motion-code"><code>&lt;script src="./path/to/elemental-ds/showcase/motion.js"&gt;&lt;/script&gt;</code></pre>
            </div>
          </div>
        </section>
      </main>
    </div>
  </template>

  <!-- The active screen mounts here (main.js); a fresh mount replays its reveals, like a remount. -->
  <div id="page-mount"></div>

  <footer class="footer">Elemental UI Design System — dark-first, token-driven, four nations.</footer>

  <!-- MODAL: stays mounted; data-state drives enter/exit, [hidden] once the exit finishes -->
  <div class="modal-backdrop" id="modal-backdrop" data-state="closed" hidden>
    <div class="modal elevation-4 glass-thick border-gradient" data-state="closed" style="--elevation-glow: var(--shadow-fire)" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="flex items-center justify-between border-b border-border-subtle pb-3 mb-4">
        <h3 id="modal-title" class="m-0 font-display text-[1.35rem] font-bold text-fire-500">Firebending Scroll</h3>
        <button class="bg-transparent border-0 text-text-muted font-bold text-[1.25rem] leading-none cursor-pointer" data-close-modal aria-label="Close">×</button>
      </div>
      <div class="text-[0.875rem] text-text-secondary leading-relaxed mb-6">Fire is the element of power. Its people have desire and will, and the energy and drive to get what they want.</div>
      <div class="flex justify-end gap-3">
        <button class="btn btn-ghost btn-sm" data-close-modal>Cancel</button>
        <button class="btn btn-fire btn-sm" data-close-modal>Accept Flame</button>
      </div>
    </div>
  </div>

  <!-- TOASTS: each toast lives in a .toast-slot so neighbours glide on enter/exit -->
  <div class="toast-stack" id="toast-stack"></div>

  <!-- TWEAKS: brand element, glow intensity (--glow-strength), density -->
  <style id="tweak-style"></style>
  <button class="btn btn-outline btn-sm tweaks-toggle" id="tweaks-toggle" aria-expanded="false" aria-controls="tweaks" data-burst="off">Tweaks</button>
  <div class="tweaks glass-thick border-gradient elevation-3" id="tweaks" hidden>
    <div class="flex items-center justify-between">
      <span class="stat-label">Tweaks</span>
      <button class="btn btn-ghost btn-sm" data-close-tweaks aria-label="Close tweaks" data-burst="off">×</button>
    </div>
    <div class="flex flex-col gap-2">
      <span class="stat-label" style="font-size:0.6875rem">Brand element</span>
      <div class="tweaks-seg" data-tweak="brand">
        <button class="btn btn-sm btn-fire" data-value="fire" data-burst="off">fire</button>
        <button class="btn btn-sm btn-ghost" data-value="water" data-burst="off">water</button>
        <button class="btn btn-sm btn-ghost" data-value="earth" data-burst="off">earth</button>
        <button class="btn btn-sm btn-ghost" data-value="air" data-burst="off">air</button>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <label for="tweak-glow" class="stat-label flex justify-between" style="font-size:0.6875rem"><span>Glow intensity</span><span id="tweak-glow-val">1.00</span></label>
      <input id="tweak-glow" type="range" min="0" max="2" step="0.05" value="1">
    </div>
    <div class="flex flex-col gap-2">
      <span class="stat-label" style="font-size:0.6875rem">Density</span>
      <div class="tweaks-seg" data-tweak="density">
        <button class="btn btn-sm btn-ghost" data-value="compact" data-burst="off">compact</button>
        <button class="btn btn-sm btn-fire" data-value="comfortable" data-burst="off">comfortable</button>
        <button class="btn btn-sm btn-ghost" data-value="editorial" data-burst="off">editorial</button>
      </div>
    </div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
