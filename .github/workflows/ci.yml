name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Token drift and missing prop docs fail the build.
      - run: npm run build
      - run: npm run build:ds
      - name: Preview bundle is up to date
        run: git diff --exit-code -- design-system/_ds_bundle.js
      - run: npx playwright install --with-deps chromium
      - run: npm run check:a11y
