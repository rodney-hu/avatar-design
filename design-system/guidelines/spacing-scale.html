<!-- @dsCard group="Spacing" viewport="700x150" subtitle="0.25rem steps through 6rem — named after the values the components use" name="Spacing scale" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div style="display:flex;flex-direction:column;gap:4px">
<div class="row" style="gap:8px"><div style="width:74px" class="k" style="text-align:left">--space-1</div><div style="height:9px;width:calc(0.25rem * 2.2);background:var(--color-fire-500)"></div><div class="k">0.25rem</div></div><div class="row" style="gap:8px"><div style="width:74px" class="k" style="text-align:left">--space-2</div><div style="height:9px;width:calc(0.5rem * 2.2);background:var(--color-fire-500)"></div><div class="k">0.5rem</div></div><div class="row" style="gap:8px"><div style="width:74px" class="k" style="text-align:left">--space-2-5</div><div style="height:9px;width:calc(0.625rem * 2.2);background:var(--color-fire-500)"></div><div class="k">0.625rem</div></div><div class="row" style="gap:8px"><div style="width:74px" class="k" style="text-align:left">--space-3</div><div style="height:9px;width:calc(0.75rem * 2.2);background:var(--color-fire-500)"></div><div class="k">0.75rem</div></div><div class="row" style="gap:8px"><div style="width:74px" class="k" style="text-align:left">--space-4</div><div style="height:9px;width:calc(1rem * 2.2);background:var(--color-fire-500)"></div><div class="k">1rem</div></div><div class="row" style="gap:8px"><div style="width:74px" class="k" style="text-align:left">--space-5</div><div style="height:9px;width:calc(1.25rem * 2.2);background:var(--color-fire-500)"></div><div class="k">1.25rem</div></div><div class="row" style="gap:8px"><div style="width:74px" class="k" style="text-align:left">--space-6</div><div style="height:9px;width:calc(1.5rem * 2.2);background:var(--color-fire-500)"></div><div class="k">1.5rem</div></div><div class="row" style="gap:8px"><div style="width:74px" class="k" style="text-align:left">--space-8</div><div style="height:9px;width:calc(2rem * 2.2);background:var(--color-fire-500)"></div><div class="k">2rem</div></div><div class="row" style="gap:8px"><div style="width:74px" class="k" style="text-align:left">--space-10</div><div style="height:9px;width:calc(2.5rem * 2.2);background:var(--color-fire-500)"></div><div class="k">2.5rem</div></div><div class="row" style="gap:8px"><div style="width:74px" class="k" style="text-align:left">--space-16</div><div style="height:9px;width:calc(4rem * 2.2);background:var(--color-fire-500)"></div><div class="k">4rem</div></div><div class="row" style="gap:8px"><div style="width:74px" class="k" style="text-align:left">--space-24</div><div style="height:9px;width:calc(6rem * 2.2);background:var(--color-fire-500)"></div><div class="k">6rem</div></div>
</div></body></html>
