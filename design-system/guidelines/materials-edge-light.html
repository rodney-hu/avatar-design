<!-- @dsCard group="Materials" viewport="760x280" name="Edge light & spotlight" subtitle="Orbiting border comet for one featured surface; cursor spotlight lights fills and neighbouring borders (hover)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);font-family:var(--font-body);color:var(--color-text-primary);padding:24px}.grid{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:16px}.c{height:220px;border-radius:var(--radius-xl);background-color:var(--color-surface-raised);border:1px solid var(--color-border-subtle);padding:18px;display:flex;flex-direction:column;justify-content:space-between}.t{font-family:var(--font-display);font-weight:800;font-size:18px}.k{font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted)}.b{font-size:13px;color:var(--color-text-secondary);line-height:1.5}</style></head>
<body><div class="grid" data-spotlight-group="">
<div class="c edge-light elevation-3"><div><div class="k">edge-light</div><div class="t" style="margin-top:6px">Flagship tier</div></div><div class="b">One per view. The comet orbits every 6s.</div></div>
<div class="c elevation-1" data-spotlight=""><div class="k">data-spotlight</div><div class="b">Move across the grid. Light pools under the cursor.</div></div>
<div class="c elevation-1 element-water" data-spotlight=""><div class="k">element-water</div><div class="b">The tint follows the element scope.</div></div>
<div class="c elevation-1 element-air" data-spotlight=""><div class="k">element-air</div><div class="b">Neighbours catch the border light.</div></div>
</div><script src="../assets/motion.js"></script></body></html>
