<!-- @dsCard group="Brand" viewport="700x130" subtitle="Deliberately tight: 4 / 6 / 8 / 12px, pills only for badges and switches" name="Corner radii" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="row">
<div style="text-align:center"><div style="width:76px;height:52px;background:var(--color-surface-raised);border:1px solid var(--color-border-strong);border-radius:var(--radius-sm)"></div><div class="k">sm · 4px</div></div><div style="text-align:center"><div style="width:76px;height:52px;background:var(--color-surface-raised);border:1px solid var(--color-border-strong);border-radius:var(--radius-md)"></div><div class="k">md · 6px</div></div><div style="text-align:center"><div style="width:76px;height:52px;background:var(--color-surface-raised);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg)"></div><div class="k">lg · 8px</div></div><div style="text-align:center"><div style="width:76px;height:52px;background:var(--color-surface-raised);border:1px solid var(--color-border-strong);border-radius:var(--radius-xl)"></div><div class="k">xl · 12px</div></div>
<div style="text-align:center"><div style="width:76px;height:32px;background:var(--color-surface-raised);border:1px solid var(--color-border-strong);border-radius:var(--radius-full)"></div><div class="k">full · pills</div></div>
</div></body></html>
