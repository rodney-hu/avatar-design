<!-- @dsCard group="Brand" viewport="700x170" subtitle="Blur appears in exactly three places: navbar, glass card, modal backdrop" name="Glass & blur" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div style="position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--color-border-subtle);padding:14px" class="bg-halo-fire">
<div class="row" style="align-items:stretch">
<div class="card card-glass" style="flex:1"><div style="font-family:var(--font-display);font-weight:700;font-size:16px">Glass card</div><div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px">rgba(26,26,26,.65) + blur(16px), 8% white border</div></div>
<div style="flex:1;background:rgba(13,13,13,.85);backdrop-filter:blur(12px);border:1px solid var(--color-border-subtle);border-radius:var(--radius-lg);padding:12px"><div style="font-family:var(--font-display);font-weight:700;font-size:16px">Navbar</div><div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px">85% base + blur(12px)</div></div>
<div style="flex:1;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);border-radius:var(--radius-lg);padding:12px"><div style="font-family:var(--font-display);font-weight:700;font-size:16px">Backdrop</div><div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px">80% black + blur(8px)</div></div>
</div></div></body></html>
