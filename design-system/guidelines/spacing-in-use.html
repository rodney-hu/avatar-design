<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="row" style="align-items:stretch">
<div class="card" style="flex:1;display:flex;flex-direction:column;gap:12px">
<span class="badge badge-fire" style="width:fit-content">Fire Nation</span>
<div style="font-family:var(--font-display);font-weight:700;font-size:20px">Sun Warrior Temple</div>
<div style="font-size:13px;color:var(--color-text-secondary)">1.5rem padding · 0.75rem internal gap · 8px radius</div>
<button class="btn btn-fire btn-sm">Enter Temple</button>
</div>
<div class="card card-raised" style="flex:1;display:flex;flex-direction:column;gap:12px">
<span class="badge badge-water" style="width:fit-content">Northern Tribe</span>
<div style="font-family:var(--font-display);font-weight:700;font-size:20px">Spirit Oasis</div>
<div style="font-size:13px;color:var(--color-text-secondary)">Raised surface, same metrics</div>
<button class="btn btn-water btn-sm">Visit Sanctuary</button>
</div></div></body></html>
