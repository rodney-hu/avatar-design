<!-- @dsCard group="Motion" viewport="700x150" subtitle="Each child delays 90ms further — grids arrive as a wave, not a block" name="Stagger cadence" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.k{font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted)}.row{display:flex;gap:12px;align-items:center}.tile{background:var(--color-surface-raised);border:1px solid var(--color-border-default);border-radius:var(--radius-lg);padding:12px;font-size:12px;color:var(--color-text-secondary)}</style></head>
<body><div class="row" style="align-items:flex-end;gap:8px" data-stagger data-reveal-loop="3400">
<div style="flex:1"><div style="height:34px;border-radius:var(--radius-sm);background:var(--color-fire-500);box-shadow:var(--shadow-fire)"></div><div class="k" style="text-align:center;margin-top:5px">0ms</div></div><div style="flex:1"><div style="height:42px;border-radius:var(--radius-sm);background:var(--color-fire-500);box-shadow:var(--shadow-fire)"></div><div class="k" style="text-align:center;margin-top:5px">90ms</div></div><div style="flex:1"><div style="height:50px;border-radius:var(--radius-sm);background:var(--color-fire-500);box-shadow:var(--shadow-fire)"></div><div class="k" style="text-align:center;margin-top:5px">180ms</div></div><div style="flex:1"><div style="height:58px;border-radius:var(--radius-sm);background:var(--color-fire-500);box-shadow:var(--shadow-fire)"></div><div class="k" style="text-align:center;margin-top:5px">270ms</div></div><div style="flex:1"><div style="height:66px;border-radius:var(--radius-sm);background:var(--color-fire-500);box-shadow:var(--shadow-fire)"></div><div class="k" style="text-align:center;margin-top:5px">360ms</div></div><div style="flex:1"><div style="height:74px;border-radius:var(--radius-sm);background:var(--color-fire-500);box-shadow:var(--shadow-fire)"></div><div class="k" style="text-align:center;margin-top:5px">450ms</div></div><div style="flex:1"><div style="height:82px;border-radius:var(--radius-sm);background:var(--color-fire-500);box-shadow:var(--shadow-fire)"></div><div class="k" style="text-align:center;margin-top:5px">540ms</div></div><div style="flex:1"><div style="height:90px;border-radius:var(--radius-sm);background:var(--color-fire-500);box-shadow:var(--shadow-fire)"></div><div class="k" style="text-align:center;margin-top:5px">630ms</div></div>
</div>
<div class="k" style="margin-top:8px">--motion-stagger 90ms · delay = index × stagger</div>
<script src="../assets/motion.js"></script></body></html>
