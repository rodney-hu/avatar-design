<!-- @dsCard group="Brand" viewport="700x170" subtitle="Five ambient loops plus two entrance animations" name="Motion" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="row" style="gap:12px;align-items:stretch">
<div style="flex:1"><div class="animate-ember" style="height:54px;border-radius:var(--radius-md);background:var(--color-surface-raised);border:1px solid var(--color-border-default)"></div><div class="k">.animate-ember 3s</div></div>
<div style="flex:1"><div class="animate-avatar-state" style="height:54px;border-radius:var(--radius-md);background:var(--color-surface-raised);border:1px solid var(--color-border-default)"></div><div class="k">.animate-avatar-state 8s</div></div>
<div style="flex:1"><div class="animate-air-float gradient-air" style="height:54px;border-radius:var(--radius-md)"></div><div class="k">.animate-air-float 4s</div></div>
<div style="flex:1"><div class="animate-water-flow gradient-water" style="height:54px;border-radius:var(--radius-md)"></div><div class="k">.animate-water-flow 6s</div></div>
</div>
<div class="k" style="text-align:left;margin-top:12px">Entrances: .animate-fade-in-up (0.4s ease-out, 16px rise) · .animate-scale-in (0.25s expo, 0.95→1). Hover rumble: .animate-earth-rumble.</div></body></html>
