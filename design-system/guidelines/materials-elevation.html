<!-- @dsCard group="Materials" viewport="760x300" name="Elevation" subtitle="Ambient + key shadow + 1px top highlight. 0 flat · 1 resting · 2 raised · 3 popover · 4 modal" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);font-family:var(--font-body);color:var(--color-text-primary)}.wrap{display:grid;grid-template-rows:1fr 1fr}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;padding:22px 24px}.tile{height:78px;border-radius:var(--radius-lg);background:var(--color-surface-raised);display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px}.n{font-family:var(--font-display);font-weight:800;font-size:18px}.k{font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted)}.light-row{background:var(--color-surface-void)}</style></head>
<body><div class="wrap">
<div class="row"><div class="tile elevation-0"><span class="n">0</span><span class="k">elevation-0</span></div><div class="tile elevation-1"><span class="n">1</span><span class="k">elevation-1</span></div><div class="tile elevation-2"><span class="n">2</span><span class="k">elevation-2</span></div><div class="tile elevation-3"><span class="n">3</span><span class="k">elevation-3</span></div><div class="tile elevation-4" style="--elevation-glow:var(--shadow-fire)"><span class="n">4</span><span class="k">+ --elevation-glow</span></div></div>
<div class="row light light-row"><div class="tile elevation-0"><span class="n">0</span><span class="k">.light</span></div><div class="tile elevation-1"><span class="n">1</span><span class="k">.light</span></div><div class="tile elevation-2"><span class="n">2</span><span class="k">.light</span></div><div class="tile elevation-3"><span class="n">3</span><span class="k">.light</span></div><div class="tile elevation-4"><span class="n">4</span><span class="k">.light</span></div></div>
</div></body></html>
