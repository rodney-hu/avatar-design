<!-- @dsCard group="Brand" viewport="700x120" subtitle="Used on hero titles and stat values only — never on body copy" name="Text glows" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="row" style="gap:20px;font-family:var(--font-brush);font-weight:400;font-size:30px">
<span class="text-glow-fire" style="color:var(--color-fire-500)">FIRE</span>
<span class="text-glow-water" style="color:var(--color-water-500)">WATER</span>
<span class="text-glow-earth" style="color:var(--color-earth-500)">EARTH</span>
<span class="text-glow-air" style="color:var(--color-air-500)">AIR</span>
<span class="text-glow-avatar" style="color:var(--color-avatar-glow)">ELEMENTAL</span>
</div></body></html>
