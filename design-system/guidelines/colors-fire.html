<!-- @dsCard group="Colors" viewport="700x130" subtitle="Cardinal red ramp anchored at #aa0000 — 500 is the CTA step" name="Fire (Primary)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="ramp"><div><div class="sw" style="background:var(--color-fire-50);border:1px solid var(--color-border-subtle)"></div><div class="k">50</div></div><div><div class="sw" style="background:var(--color-fire-100);"></div><div class="k">100</div></div><div><div class="sw" style="background:var(--color-fire-200);"></div><div class="k">200</div></div><div><div class="sw" style="background:var(--color-fire-300);"></div><div class="k">300</div></div><div><div class="sw" style="background:var(--color-fire-400);"></div><div class="k">400</div></div><div><div class="sw" style="background:var(--color-fire-500);"></div><div class="k">500</div></div><div><div class="sw" style="background:var(--color-fire-600);"></div><div class="k">600</div></div><div><div class="sw" style="background:var(--color-fire-700);"></div><div class="k">700</div></div><div><div class="sw" style="background:var(--color-fire-800);"></div><div class="k">800</div></div><div><div class="sw" style="background:var(--color-fire-900);"></div><div class="k">900</div></div></div><div class="row" style="margin-top:10px"><div class="sw glow-fire" style="width:90px;background:var(--color-fire-500)"></div><div class="k" style="text-align:left">500 + .glow-fire<br>#aa0000</div><div class="sw" style="width:90px;background:var(--color-fire-glow)"></div><div class="k" style="text-align:left">glow<br>#e01010</div></div></body></html>
