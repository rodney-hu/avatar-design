<!-- @dsCard group="Colors" viewport="700x130" subtitle="Five near-black layers from void to overlay — the default theme" name="Surface depth (dark)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="row" style="gap:0;align-items:stretch">
<div style="flex:1"><div style="height:64px;background:var(--color-surface-void);border:1px solid var(--color-border-default)"></div><div class="k" style="padding-top:4px">void</div></div><div style="flex:1"><div style="height:64px;background:var(--color-surface-base);border:1px solid var(--color-border-default)"></div><div class="k" style="padding-top:4px">base</div></div><div style="flex:1"><div style="height:64px;background:var(--color-surface-raised);border:1px solid var(--color-border-default)"></div><div class="k" style="padding-top:4px">raised</div></div><div style="flex:1"><div style="height:64px;background:var(--color-surface-elevated);border:1px solid var(--color-border-default)"></div><div class="k" style="padding-top:4px">elevated</div></div><div style="flex:1"><div style="height:64px;background:var(--color-surface-overlay);border:1px solid var(--color-border-default)"></div><div class="k" style="padding-top:4px">overlay</div></div>
</div></body></html>
