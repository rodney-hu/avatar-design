<!-- @dsCard group="Brand" viewport="700x150" subtitle="Filled buttons lift 1px and brighten their glow; press settles to 0" name="Hover & press states" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="row" style="gap:14px">
<div><button class="btn btn-fire">Rest</button><div class="k" style="margin-top:6px">default</div></div>
<div><button class="btn btn-fire" style="background:linear-gradient(135deg,var(--color-fire-400) 0%,var(--color-fire-500) 100%);box-shadow:0 6px 20px rgb(var(--fire-500-rgb) / .55),0 0 30px rgb(var(--fire-glow-rgb) / .3);transform:translateY(-1px)">Hover</button><div class="k" style="margin-top:6px">−1px, glow up</div></div>
<div><button class="btn btn-fire" style="box-shadow:0 2px 10px rgb(var(--fire-500-rgb) / .4)">Active</button><div class="k" style="margin-top:6px">glow down</div></div>
<div><button class="btn btn-outline" style="border-color:var(--color-fire-500);color:var(--color-fire-400);box-shadow:0 0 15px rgb(var(--fire-500-rgb) / .25)">Outline hover</button><div class="k" style="margin-top:6px">border→fire</div></div>
<div><button class="btn btn-fire" disabled>Disabled</button><div class="k" style="margin-top:6px">45% opacity</div></div>
</div>
<div class="k" style="text-align:left;margin-top:10px">All transitions 0.2s cubic-bezier(0.16,1,0.3,1). Hover never changes layout size.</div></body></html>
