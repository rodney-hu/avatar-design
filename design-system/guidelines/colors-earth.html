<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="ramp"><div><div class="sw" style="background:var(--color-earth-50);border:1px solid var(--color-border-subtle)"></div><div class="k">50</div></div><div><div class="sw" style="background:var(--color-earth-100);"></div><div class="k">100</div></div><div><div class="sw" style="background:var(--color-earth-200);"></div><div class="k">200</div></div><div><div class="sw" style="background:var(--color-earth-300);"></div><div class="k">300</div></div><div><div class="sw" style="background:var(--color-earth-400);"></div><div class="k">400</div></div><div><div class="sw" style="background:var(--color-earth-500);"></div><div class="k">500</div></div><div><div class="sw" style="background:var(--color-earth-600);"></div><div class="k">600</div></div><div><div class="sw" style="background:var(--color-earth-700);"></div><div class="k">700</div></div><div><div class="sw" style="background:var(--color-earth-800);"></div><div class="k">800</div></div><div><div class="sw" style="background:var(--color-earth-900);"></div><div class="k">900</div></div></div></body></html>
