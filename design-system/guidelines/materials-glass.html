<!-- @dsCard group="Materials" viewport="760x260" name="Glass tiers & grain" subtitle="thin 8px · regular 16px · thick 28px blur, lit gradient edge, film grain" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);font-family:var(--font-body);color:var(--color-text-primary)}.stage{position:relative;height:260px;overflow:hidden}.orb{position:absolute;border-radius:50%;filter:blur(2px)}.row{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:40px 24px}.p{height:170px;border-radius:var(--radius-xl);padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}.t{font-family:var(--font-display);font-weight:800;font-size:17px}.k{font-family:var(--font-mono);font-size:10px;color:var(--color-text-secondary)}</style></head>
<body><div class="stage grain">
<div class="orb gradient-fire motion-gradient-drift" style="width:240px;height:240px;left:40px;top:30px"></div>
<div class="orb gradient-water motion-gradient-drift" style="width:200px;height:200px;left:330px;top:-40px"></div>
<div class="orb gradient-air motion-gradient-drift" style="width:180px;height:180px;left:560px;top:110px"></div>
<div class="row">
<div class="p glass-thin border-gradient elevation-2"><span class="t">Thin</span><span class="k">glass-thin · tooltips, chips</span></div>
<div class="p glass border-gradient elevation-2"><span class="t">Regular</span><span class="k">glass · cards, nav</span></div>
<div class="p glass-thick border-gradient elevation-3"><span class="t">Thick</span><span class="k">glass-thick · modals, sheets</span></div>
<div class="p glass border-gradient grain elevation-2"><span class="t">+ Grain</span><span class="k">grain · hero panels</span></div>
</div></div></body></html>
