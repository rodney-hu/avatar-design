<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="row" style="gap:10px">
<div style="flex:1"><div class="gradient-fire" style="height:56px;border-radius:var(--radius-md)"></div><div class="k">.gradient-fire</div></div><div style="flex:1"><div class="gradient-water" style="height:56px;border-radius:var(--radius-md)"></div><div class="k">.gradient-water</div></div><div style="flex:1"><div class="gradient-earth" style="height:56px;border-radius:var(--radius-md)"></div><div class="k">.gradient-earth</div></div><div style="flex:1"><div class="gradient-air" style="height:56px;border-radius:var(--radius-md)"></div><div class="k">.gradient-air</div></div>
</div></body></html>
