<!-- @dsCard group="Motion" viewport="760x300" subtitle="Each .element-* scope retunes reveal, hover and press. Fire snaps, water flows, earth settles heavy, air springs and floats. Hover and press the buttons" name="Element personalities" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:20px 24px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.col{display:flex;flex-direction:column;gap:12px}.n{font-family:var(--font-display);font-weight:800;font-size:18px}.k{font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted);line-height:1.5}.stack{display:flex;flex-direction:column;gap:6px;height:84px}.bar{height:22px;border-radius:var(--radius-sm);background:var(--element-bg);border:1px solid var(--element-border)}</style></head>
<body><div class="g">
<div class="col element-fire"><span class="n" style="color:var(--fire-text)">Fire</span><div class="stack" data-stagger="" data-reveal-loop="3200"><div class="bar"></div><div class="bar" style="width:80%"></div><div class="bar" style="width:60%"></div></div><button class="btn btn-fire">Strike</button><span class="k">560ms expo-out · 28px · press 0.97<br>idle: ember flicker</span></div>
<div class="col element-water"><span class="n" style="color:var(--water-text)">Water</span><div class="stack" data-stagger="" data-reveal-loop="3200"><div class="bar"></div><div class="bar" style="width:80%"></div><div class="bar" style="width:60%"></div></div><button class="btn btn-water">Flow</button><span class="k">950ms sine · 44px · lift 2px<br>idle: tide</span></div>
<div class="col element-earth"><span class="n" style="color:var(--earth-text)">Earth</span><div class="stack" data-stagger="" data-reveal-loop="3200"><div class="bar"></div><div class="bar" style="width:80%"></div><div class="bar" style="width:60%"></div></div><button class="btn btn-earth">Ground</button><span class="k">620ms quart-out · 14px · no lift<br>press sinks 2px + rumble</span></div>
<div class="col element-air"><span class="n" style="color:var(--air-text)">Air</span><div class="stack" data-stagger="" data-reveal-loop="3200"><div class="bar"></div><div class="bar" style="width:80%"></div><div class="bar" style="width:60%"></div></div><button class="btn btn-air">Lift</button><span class="k">900ms spring · 56px · lift 4px<br>idle: float</span></div>
</div><script src="../assets/motion.js"></script></body></html>
