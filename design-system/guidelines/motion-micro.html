<!-- @dsCard group="Motion" viewport="760x300" name="Micro-interactions" subtitle="Hover for the sheen, click for each element's burst, focus the fields, tick the boxes, press the toggle" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:22px 24px;display:flex;flex-direction:column;gap:22px}.h{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:10px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.g{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:18px;align-items:end}.lab{display:inline-flex;align-items:center;gap:.5rem;font-size:14px;cursor:pointer}</style></head>
<body>
<div><div class="h">Buttons · sheen on hover · burst on click</div><div class="row">
<button class="btn btn-fire">Fire</button><button class="btn btn-water">Water</button><button class="btn btn-earth">Earth</button><button class="btn btn-air">Air</button><button class="btn btn-avatar">Avatar</button><button class="btn btn-outline">Outline</button></div></div>
<div class="g">
<div class="field"><label class="stat-label field-label" style="font-size:.75rem" for="a">Fire field</label><span class="field-control"><input class="input" id="a" placeholder="Focus me"><span class="field-line"></span></span></div>
<div class="field field-water"><label class="stat-label field-label" style="font-size:.75rem" for="b">Water field</label><span class="field-control"><input class="input input-water" id="b" placeholder="Focus me"><span class="field-line"></span></span></div>
<div class="row" style="gap:18px;padding-bottom:8px">
<label class="lab"><span class="check"><input type="checkbox" class="checkbox"><svg class="check-mark" viewBox="0 0 16 16"><path pathLength="1" d="M3.5 8.5l3 3 6-7"></path></svg></span>Fire</label>
<label class="lab"><span class="check" style="--field-rgb:var(--water-500-rgb)"><input type="checkbox" class="checkbox" checked><svg class="check-mark" viewBox="0 0 16 16"><path pathLength="1" d="M3.5 8.5l3 3 6-7"></path></svg></span>Water</label>
<label class="toggle-switch"><input type="checkbox" checked><span class="toggle-slider"></span></label></div>
</div>
<script src="../assets/motion.js"></script></body></html>
