<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="row" style="gap:10px;align-items:stretch">
<div style="flex:1"><div class="bg-halo-fire" style="height:92px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle);background-color:var(--color-surface-base)"></div><div class="k">.bg-halo-fire</div></div><div style="flex:1"><div class="bg-halo-water" style="height:92px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle);background-color:var(--color-surface-base)"></div><div class="k">.bg-halo-water</div></div><div style="flex:1"><div class="bg-halo-earth" style="height:92px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle);background-color:var(--color-surface-base)"></div><div class="k">.bg-halo-earth</div></div><div style="flex:1"><div class="bg-halo-air" style="height:92px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle);background-color:var(--color-surface-base)"></div><div class="k">.bg-halo-air</div></div>
</div></body></html>
