<!-- @dsCard group="Brand" viewport="760x300" subtitle="Core halo in the glow step + ambient bloom in the 500 step. Size sm/md/lg/xl, one global --glow-strength, soft drop shadow on parchment" name="Glow system" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body)}.band{display:grid;grid-template-columns:70px repeat(5,1fr);gap:18px;align-items:center;padding:22px 24px}.t{width:100%;height:48px;border-radius:var(--radius-md);background:var(--color-surface-raised);border:1px solid var(--color-border-default)}.k{font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted);margin-top:6px;text-align:center}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.08em}</style></head>
<body>
<div class="band"><span class="lbl">Element</span><div><div class="t glow-fire"></div><div class="k">glow-fire</div></div><div><div class="t glow-water"></div><div class="k">glow-water</div></div><div><div class="t glow-earth"></div><div class="k">glow-earth</div></div><div><div class="t glow-air"></div><div class="k">glow-air</div></div><div><div class="t glow-avatar"></div><div class="k">glow-avatar</div></div></div>
<div class="band" style="padding-top:4px"><span class="lbl">Size</span><div><div class="t glow-water glow-sm"></div><div class="k">glow-sm</div></div><div><div class="t glow-water"></div><div class="k">md (default)</div></div><div><div class="t glow-water glow-lg"></div><div class="k">glow-lg</div></div><div><div class="t glow-water glow-xl"></div><div class="k">glow-xl</div></div><div><div class="t glow-water glow-lg" style="--glow-strength:.5"></div><div class="k">--glow-strength .5</div></div></div>
<div class="band light" style="background:var(--color-surface-void)"><span class="lbl">.light</span><div><div class="t glow-fire"></div><div class="k">glow-fire</div></div><div><div class="t glow-water"></div><div class="k">glow-water</div></div><div><div class="t glow-earth"></div><div class="k">glow-earth</div></div><div><div class="t glow-air"></div><div class="k">glow-air</div></div><div><div class="t glow-avatar"></div><div class="k">glow-avatar</div></div></div>
</body></html>
