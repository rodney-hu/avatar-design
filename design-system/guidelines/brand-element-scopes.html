<!-- @dsCard group="Brand" viewport="700x150" subtitle=".element-* sets --element-primary/hover/active/glow/bg/border for a subtree" name="Element scopes" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="row" style="gap:10px;align-items:stretch">
<div class="element-fire" style="flex:1;background:var(--element-bg);border:1px solid var(--element-border);border-radius:var(--radius-lg);padding:12px">
<div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--element-primary)">fire</div>
<div style="height:6px;border-radius:3px;background:var(--element-primary);margin-top:8px;box-shadow:0 0 12px var(--element-glow)"></div>
<div class="k" style="text-align:left;margin-top:8px">.element-fire</div></div><div class="element-water" style="flex:1;background:var(--element-bg);border:1px solid var(--element-border);border-radius:var(--radius-lg);padding:12px">
<div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--element-primary)">water</div>
<div style="height:6px;border-radius:3px;background:var(--element-primary);margin-top:8px;box-shadow:0 0 12px var(--element-glow)"></div>
<div class="k" style="text-align:left;margin-top:8px">.element-water</div></div><div class="element-earth" style="flex:1;background:var(--element-bg);border:1px solid var(--element-border);border-radius:var(--radius-lg);padding:12px">
<div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--element-primary)">earth</div>
<div style="height:6px;border-radius:3px;background:var(--element-primary);margin-top:8px;box-shadow:0 0 12px var(--element-glow)"></div>
<div class="k" style="text-align:left;margin-top:8px">.element-earth</div></div><div class="element-air" style="flex:1;background:var(--element-bg);border:1px solid var(--element-border);border-radius:var(--radius-lg);padding:12px">
<div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--element-primary)">air</div>
<div style="height:6px;border-radius:3px;background:var(--element-primary);margin-top:8px;box-shadow:0 0 12px var(--element-glow)"></div>
<div class="k" style="text-align:left;margin-top:8px">.element-air</div></div>
</div></body></html>
