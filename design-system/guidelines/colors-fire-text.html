<!-- @dsCard group="Colors" viewport="700x140" subtitle="--fire-text flips per theme: near-white fire-50 on dark, fire-700 on parchment" name="Fire as text" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="row" style="align-items:stretch">
<div style="flex:1;background:var(--color-surface-base);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:12px">
<div style="color:var(--fire-text);font-weight:700;font-size:15px">Fire Nation Power</div>
<div class="k" style="text-align:left;margin-top:6px">dark → fire-50 · ~17:1 (links: --fire-link, fire-300 · 6.8:1)</div>
</div>
<div class="light" style="flex:1;background:var(--color-surface-base);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:12px">
<div style="color:var(--fire-text);font-weight:700;font-size:15px">Fire Nation Power</div>
<div class="k" style="text-align:left;margin-top:6px;color:var(--color-text-muted)">light → fire-700 · 11.2:1</div>
</div></div>
<div class="k" style="text-align:left;margin-top:8px">fire-500 (#aa0000) is 2.5:1 and fire-400 (#dd3333) 4.25:1 on #0d0d0d. Neither is used as text; they stay on fills, borders and glows.</div></body></html>
