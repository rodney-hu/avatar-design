<!-- @dsCard group="Colors" viewport="700x150" subtitle="Four text steps, three border weights" name="Text & border neutrals" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.ramp>div{display:flex;flex-direction:column;gap:4px}.sw{height:52px;border-radius:var(--radius-md)}.k{font-family:var(--font-mono);font-size:9px;color:var(--color-text-muted);text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body><div class="row" style="align-items:flex-start;gap:24px">
<div>
<div style="color:var(--color-text-primary);font-size:15px">Primary #f0f0f0</div>
<div style="color:var(--color-text-secondary);font-size:15px">Secondary #a0a0a0</div>
<div style="color:var(--color-text-muted);font-size:15px">Muted #8c8c8c</div>
<div style="color:var(--color-text-disabled);font-size:15px">Disabled #444444</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:8px">
<div style="border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);padding:6px 10px;font-size:11px;color:var(--color-text-muted);font-family:var(--font-mono)">--color-border-subtle</div><div style="border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:6px 10px;font-size:11px;color:var(--color-text-muted);font-family:var(--font-mono)">--color-border-default</div><div style="border:1px solid var(--color-border-strong);border-radius:var(--radius-md);padding:6px 10px;font-size:11px;color:var(--color-text-muted);font-family:var(--font-mono)">--color-border-strong</div>
</div></div></body></html>
