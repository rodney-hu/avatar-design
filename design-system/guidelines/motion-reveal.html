<!-- @dsCard group="Motion" viewport="700x160" subtitle="700ms fade-up over 40px on viewport entry — looping here to show the curve" name="Scroll reveal" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}.k{font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted)}.row{display:flex;gap:12px;align-items:center}.tile{background:var(--color-surface-raised);border:1px solid var(--color-border-default);border-radius:var(--radius-lg);padding:12px;font-size:12px;color:var(--color-text-secondary)}</style></head>
<body><div class="row" style="align-items:stretch" data-stagger data-reveal-loop="3200">
<div class="tile" style="flex:1"><div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--color-text-primary)">Card 1</div><div style="margin-top:4px">Enters on scroll</div></div><div class="tile" style="flex:1"><div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--color-text-primary)">Card 2</div><div style="margin-top:4px">Enters on scroll</div></div><div class="tile" style="flex:1"><div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--color-text-primary)">Card 3</div><div style="margin-top:4px">Enters on scroll</div></div><div class="tile" style="flex:1"><div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--color-text-primary)">Card 4</div><div style="margin-top:4px">Enters on scroll</div></div>
</div>
<div class="k" style="margin-top:12px">data-reveal · data-stagger (90ms per child) · --motion-rise 40px · --motion-ease expo out</div>
<script src="../assets/motion.js"></script></body></html>
