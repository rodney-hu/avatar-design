<!-- @dsCard group="Components" viewport="700x330" name="Data" subtitle="StatCard counts up on view and flashes on change (fire value ticks every 2.5s); elemental table" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--color-surface-void);color:var(--color-text-primary);font-family:var(--font-body);padding:16px}#root{display:flex;flex-direction:column;gap:14px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted);font-weight:600}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { StatCard, DataTable, Badge } = window.ElementalUIDesignSystem_5d6c38;
function Demo(){
  const [v,setV]=React.useState(98.4);
  React.useEffect(()=>{const t=setInterval(()=>setV(p=>Math.round(Math.min(99.9,Math.max(94,p+(Math.random()-.45)*3))*10)/10),2500);return()=>clearInterval(t)},[]);
  return (<>
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
      <StatCard element="fire" label="Fire Power" value={v.toFixed(1)+'%'} delta="↑ +14.2%"/>
      <StatCard element="water" label="Flow Rate" value="1,420 L/s" delta="Full moon"/>
      <StatCard element="earth" label="Seismic" value="840 MPa" delta="Stable"/>
      <StatCard element="air" label="Velocity" value="120 km/h" delta="Lift optimal"/>
    </div>
    <DataTable columns={['Master','Affiliation','Specialty','Status']} rows={[
      ['Zuko','Fire Nation','Lightning Redirection',<Badge variant="fire">Fire Lord</Badge>],
      ['Katara','Southern Water Tribe','Healing',<Badge variant="water">Grandmaster</Badge>],
      ['Toph Beifong','Earth Kingdom','Metalbending',<Badge variant="earth">Chief</Badge>]
    ]}/>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
